    <script>
      (function() {
        // 1. Polyfill writable fetch setter on window for browser extensions that patch fetch
        try {
          var _origFetch = window.fetch;
          var _curFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _curFetch;
            },
            set: function(newFetch) {
              _curFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Ignore if property is already locked
        }

        // 2. Suppress unhandled errors coming from third-party chrome extensions
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            return true;
          }
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
